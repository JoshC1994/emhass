name: Trigger Addon Sync

on:
  push:
    branches:
      - '*'
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to sync'
        required: false
        default: ''

jobs:
  get-branch-info:
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.get-branch.outputs.branch }}
      commit_sha: ${{ steps.get-branch.outputs.sha }}
      short_sha: ${{ steps.get-branch.outputs.short_sha }}
      base_version: ${{ steps.get-version.outputs.base_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Get branch name
        id: get-branch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH="${{ github.event.inputs.target_branch }}"
            if [ -z "$BRANCH" ]; then
              BRANCH="${{ github.ref_name }}"
            fi
          else
            BRANCH="${{ github.ref_name }}"
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Get base version from pyproject.toml
        id: get-version
        run: |
          VERSION=$(grep -m1 '^version\s*=' pyproject.toml | cut -d'"' -f2)
          echo "base_version=$VERSION" >> $GITHUB_OUTPUT

  dispatch-to-addon-repo:
    needs: get-branch-info
    runs-on: ubuntu-latest
    steps:
      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ADDON_SYNC_TOKEN }}
          repository: JoshC1994/emhass-add-on
          event-type: emhass-branch-sync
          client-payload: |-
            {
              "branch_name": "${{ needs.get-branch-info.outputs.branch_name }}",
              "commit_sha": "${{ needs.get-branch-info.outputs.commit_sha }}",
              "short_sha": "${{ needs.get-branch-info.outputs.short_sha }}",
              "base_version": "${{ needs.get-branch-info.outputs.base_version }}"
            }
