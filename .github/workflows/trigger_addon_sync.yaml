name: Trigger Addon Sync on Commit

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/workflows/trigger_addon_sync.yaml'

jobs:
  trigger-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger emhass-add-on sync workflow
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.ADDON_SYNC_TOKEN }}" \
            https://api.github.com/repos/JoshC1994/emhass-add-on/actions/workflows/sync_branch_addon.yaml/dispatches \
            -d '{"ref":"main","inputs":{"source_branch":"master","target_branch":"main"}}'
          
          echo "Triggered sync workflow in emhass-add-on"
