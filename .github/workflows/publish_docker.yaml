name: Publish Docker

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to build'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/joshc1994/emhass

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || github.ref }}
          fetch-depth: 1

      - name: Calculate image information
        id: image-info
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${{ github.event.inputs.target_branch || github.ref_name }}"
          SHA="${GITHUB_SHA:0:7}"

          SAFE_BRANCH="$(printf '%s' "$BRANCH" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's#[^a-z0-9._-]#-#g' \
            | sed 's/^-*//' \
            | sed 's/-*$//')"

          if [ -z "$SAFE_BRANCH" ]; then
            SAFE_BRANCH="unknown"
          fi

          VERSION="$(
            sed -nE \
              's/^[[:space:]]*version[[:space:]]*=[[:space:]]*["'\'']([^"'\'']+)["'\''][[:space:]]*$/\1/p' \
              pyproject.toml \
              | head -n 1
          )"

          if [ -z "$VERSION" ]; then
            echo "Could not find project version in pyproject.toml"
            exit 1
          fi

          IMAGE_TAG="${VERSION}-${SHA}-${SAFE_BRANCH}"

          echo "branch=$BRANCH"
          echo "safe_branch=$SAFE_BRANCH"
          echo "version=$VERSION"
          echo "sha=$SHA"
          echo "image_tag=$IMAGE_TAG"

          {
            echo "branch=$BRANCH"
            echo "safe_branch=$SAFE_BRANCH"
            echo "version=$VERSION"
            echo "sha=$SHA"
            echo "image_tag=$IMAGE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.image-info.outputs.image_tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.image-info.outputs.safe_branch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image-info.outputs.image_tag }}
          cache-from: type=gha,scope=${{ steps.image-info.outputs.safe_branch }}
          cache-to: type=gha,mode=max,scope=${{ steps.image-info.outputs.safe_branch }}

      - name: Dispatch build information to add-on repository
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ADDON_SYNC_TOKEN }}
          repository: JoshC1994/emhass-add-on
          event-type: emhass-branch-sync
          client-payload: >-
            {
              "branch_name": "${{ steps.image-info.outputs.branch }}",
              "commit_sha": "${{ github.sha }}",
              "short_sha": "${{ steps.image-info.outputs.sha }}",
              "base_version": "${{ steps.image-info.outputs.version }}",
              "image": "${{ env.IMAGE_NAME }}:${{ steps.image-info.outputs.image_tag }}"
            }
