name: Publish Docker and Sync Add-on

on:
  push:
    branches:
      - "**"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/joshc1994/emhass

jobs:
  build-and-sync:
    name: Build image and update HA add-on
    runs-on: ubuntu-latest

    steps:
      - name: Check out EMHASS
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Calculate build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          branch="${GITHUB_REF_NAME}"
          short_sha="$(git rev-parse --short=7 HEAD)"

          safe_branch="$(printf '%s' "$branch" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's#[^a-z0-9._-]#-#g' \
            | sed 's/^-*//' \
            | sed 's/-*$//')"

          if [ -z "$safe_branch" ]; then
            echo "Could not create a Docker-safe branch name."
            exit 1
          fi

          base_version="$(
            grep -E '^[[:space:]]*version[[:space:]]*=' pyproject.toml \
              | head -n 1 \
              | sed -E 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*["'\'']([^"'\'']+)["'\''].*/\1/'
          )"

          if [ -z "$base_version" ]; then
            base_version="0.0.0"
          fi

          image_tag="${base_version}-${short_sha}-${safe_branch}"

          echo "Branch: $branch"
          echo "Version: $base_version"
          echo "Image tag: $image_tag"

          {
            echo "branch=$branch"
            echo "short_sha=$short_sha"
            echo "base_version=$base_version"
            echo "safe_branch=$safe_branch"
            echo "image_tag=$image_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.metadata.outputs.image_tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.metadata.outputs.safe_branch }}
          cache-from: type=gha,scope=${{ steps.metadata.outputs.safe_branch }}
          cache-to: type=gha,mode=max,scope=${{ steps.metadata.outputs.safe_branch }}

      - name: Trigger add-on repository sync
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ADDON_SYNC_TOKEN }}
          repository: JoshC1994/emhass-add-on
          event-type: emhass-branch-sync
          client-payload: >-
            {
              "branch_name": "${{ steps.metadata.outputs.branch }}",
              "commit_sha": "${{ github.sha }}",
              "short_sha": "${{ steps.metadata.outputs.short_sha }}",
              "base_version": "${{ steps.metadata.outputs.base_version }}"
            }
