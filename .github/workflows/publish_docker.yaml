name: Publish Docker

on:
  push:
    branches:
      - '*'
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  get-branch-info:
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.get-branch.outputs.branch }}
      base_version: ${{ steps.get-version.outputs.base_version }}
      short_sha: ${{ steps.get-branch.outputs.short_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Get branch name
        id: get-branch
        run: |
          BRANCH="${{ github.ref_name }}"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Get base version from pyproject.toml
        id: get-version
        run: |
          VERSION=$(grep -m1 '^version\s*=' pyproject.toml | cut -d'"' -f2)
          echo "base_version=$VERSION" >> $GITHUB_OUTPUT

  build-and-push:
    needs: get-branch-info
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.get-branch-info.outputs.base_version }}-${{ needs.get-branch-info.outputs.short_sha }}-${{ needs.get-branch-info.outputs.branch_name }}
            type=raw,value=${{ needs.get-branch-info.outputs.branch_name }}
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
